<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&P 500 Treemap — Mockup</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--border);
    background:var(--panel);flex-wrap:wrap;}
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.3px;}
  header .sub{color:var(--muted);font-size:12px;}
  .controls{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);}
  .controls select{background:#0d1117;color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:4px 8px;font-size:12px;}
  /* legend */
  .legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
  .legend .bar{width:220px;height:12px;border-radius:3px;
    background:linear-gradient(90deg,#7a1616,#b23434,#3d4450,#2f9e5c,#128a3d);}
  #map{position:relative;width:100%;height:calc(100% - 56px);}
  .sector{position:absolute;overflow:hidden;}
  .sector-label{position:absolute;top:0;left:0;right:0;height:18px;line-height:18px;
    font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    color:#c9d1d9;padding:0 6px;background:rgba(0,0,0,.35);z-index:2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
  .tile{position:absolute;border:1px solid rgba(0,0,0,.55);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;cursor:default;color:#fff;line-height:1.15;}
  .tile:hover{outline:2px solid #fff;outline-offset:-2px;z-index:5;}
  .tk{font-weight:700;}
  .pr{opacity:.9;}
  .dp{font-weight:600;}
  .ww{opacity:.85;}
  .tt{position:fixed;pointer-events:none;z-index:50;background:#000;border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5);}
  .tt b{font-size:13px;}
  .tt .row{display:flex;justify-content:space-between;gap:16px;color:var(--muted);}
  .tt .row span:last-child{color:var(--text);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<header>
  <h1>S&amp;P 500</h1>
  <span class="sub" id="asof">as of — mockup with sample data</span>
  <div class="controls">
    <label>Size <select id="sizeSel"><option>Market cap</option><option>Equal</option></select></label>
    <label>Color <select id="colorSel"><option>DoD %</option><option>WoW %</option></select></label>
    <div class="legend"><span>−3%</span><div class="bar"></div><span>+3%</span></div>
  </div>
</header>
<div id="map"></div>
<div class="tt" id="tt"></div>

<script>
// ---- SAMPLE DATA (mockup only). Real version pulls from yfinance. ----
// [ticker, sector, price, marketCap($B), DoD%, WoW%]
const RAW = [

  ["GS","Financials",478.0,157,0.9,2.4],["MS","Financials",99.1,161,0.2,0.6],
  ["AXP","Financials",232.5,168,0.7,1.9],["SPGI","Financials",448.9,140,-0.1,0.5],

  ["LIN","Materials",442.0,212,0.2,0.6],["SHW","Materials",305.1,77,-0.3,0.4],

  ["NEE","Utilities",72.3,148,-0.4,0.5],["SO","Utilities",81.2,89,0.2,0.7],
  ["DUK","Utilities",103.5,80,-0.1,0.4],["CEG","Utilities",202.1,63,1.1,2.6],

  ["PLD","Real Estate",122.4,113,-0.6,-1.0],["AMT","Real Estate",195.3,91,0.3,0.9],
  ["EQIX","Real Estate",762.0,72,0.5,1.2],["WELL","Real Estate",108.2,64,-0.2,0.4]
];

const SECTOR_ORDER = ["Information Technology","Communication Services","Consumer Discretionary","Financials",
  "Health Care","Consumer Staples","Industrials","Energy","Utilities","Materials","Real Estate"];

// ---- SAMPLE trend series (mockup). Real version = normalized daily closes from yfinance. ----
// Each series = fractional return vs. start of window (0 = flat, 0.03 = +3%). ~22 daily points.
const N=22;
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0;}
function lcg(seed){let x=seed>>>0;return()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296;};}
function genSeries(ticker,endRet){        // random walk, pinned so last point == endRet
  const r=lcg(hashStr(ticker)||1);let v=0;const arr=[0];
  for(let i=1;i<N;i++){v+=(r()-0.5)*0.018;arr.push(v);}
  const adj=endRet-arr[N-1];
  return arr.map((x,i)=>x+adj*(i/(N-1)));
}
const SERIES={};        // per ticker
const bySectorSeries={};
for(const r of RAW){
  const t=r[0],sec=r[1],endRet=(r[5]/100)*2.2;   // ~month drift ≈ 2x the WoW move
  SERIES[t]=genSeries(t,endRet);
  (bySectorSeries[sec]=bySectorSeries[sec]||[]).push(SERIES[t]);
}
function avgSeries(list){const out=new Array(N).fill(0);
  for(const s of list)for(let i=0;i<N;i++)out[i]+=s[i]/list.length;return out;}
const SECTOR_SERIES={};for(const k in bySectorSeries)SECTOR_SERIES[k]=avgSeries(bySectorSeries[k]);
const SPX_SERIES=avgSeries(Object.values(SERIES));

function sparkline(ticker,sector){
  const a=SERIES[ticker],b=SECTOR_SERIES[sector],c=SPX_SERIES;
  const all=a.concat(b,c);let mn=Math.min(...all),mx=Math.max(...all);
  if(mx-mn<1e-6){mx+=0.01;mn-=0.01;}
  const W=190,H=54,pad=3;
  const X=i=>pad+i*(W-2*pad)/(N-1);
  const Y=v=>pad+(1-(v-mn)/(mx-mn))*(H-2*pad);
  const path=s=>s.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const zeroY=Y(0).toFixed(1);
  return `<svg width="${W}" height="${H}" style="display:block;margin-top:6px">
    <line x1="${pad}" y1="${zeroY}" x2="${W-pad}" y2="${zeroY}" stroke="#30363d" stroke-dasharray="2 2" stroke-width="1"/>
    <path d="${path(c)}" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 2" opacity=".8"/>
    <path d="${path(b)}" fill="none" stroke="#d29922" stroke-width="1.2" opacity=".9"/>
    <path d="${path(a)}" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
  </svg>
  <div style="display:flex;gap:10px;font-size:10px;margin-top:2px">
    <span style="color:#58a6ff">— ${ticker}</span>
    <span style="color:#d29922">— Sector</span>
    <span style="color:#8b949e">-- S&amp;P 500</span>
  </div>`;
}

// ---- color scale: diverging red->gray->green, clamp at +/-3% ----
function lerp(a,b,t){return a+(b-a)*t;}
function hex(c){return c.toString(16).padStart(2,'0');}
function colorFor(v){
  const c=Math.max(-3,Math.min(3,v))/3; // -1..1
  let r,g,b;
  const gray=[61,68,80];
  if(c<0){const t=-c;r=lerp(gray[0],140,t);g=lerp(gray[1],28,t);b=lerp(gray[2],28,t);}
  else{const t=c;r=lerp(gray[0],18,t);g=lerp(gray[1],150,t);b=lerp(gray[2],70,t);}
  return `rgb(${r|0},${g|0},${b|0})`;
}

// ---- squarified treemap ----
function squarify(items,x,y,w,h){
  // items: [{value,...}] returns with .rect
  const total=items.reduce((s,i)=>s+i.value,0);
  let scale=(w*h)/total;
  const norm=items.map(i=>({...i,area:i.value*scale}));
  const out=[];
  let rx=x,ry=y,rw=w,rh=h;
  let row=[],i=0;
  function worst(row,len){
    const s=row.reduce((a,b)=>a+b.area,0);
    const mx=Math.max(...row.map(r=>r.area));
    const mn=Math.min(...row.map(r=>r.area));
    return Math.max((len*len*mx)/(s*s),(s*s)/(len*len*mn));
  }
  function layoutRow(row,len,horizontal){
    const s=row.reduce((a,b)=>a+b.area,0);
    const thick=s/len;
    let off=0;
    for(const r of row){
      const cell=r.area/thick;
      if(horizontal){out.push({...r,rect:[rx,ry+off,thick,cell]});off+=cell;}
      else{out.push({...r,rect:[rx+off,ry,cell,thick]});off+=cell;}
    }
    if(horizontal){rx+=thick;rw-=thick;}else{ry+=thick;rh-=thick;}
  }
  while(i<norm.length){
    const horizontal=rw<rh? false: true; // shorter side
    const len= horizontal? rh: rw;
    const cur=norm[i];
    if(row.length===0){row.push(cur);i++;continue;}
    if(worst(row,len)>=worst([...row,cur],len)){row.push(cur);i++;}
    else{layoutRow(row,len,horizontal);row=[];}
  }
  if(row.length){
    const horizontal=rw<rh? false: true;
    const len= horizontal? rh: rw;
    layoutRow(row,len,horizontal);
  }
  return out;
}

function build(){
  const map=document.getElementById('map');
  map.innerHTML='';
  const W=map.clientWidth,H=map.clientHeight;
  const sizeMode=document.getElementById('sizeSel').value;
  const colorMode=document.getElementById('colorSel').value;

  // group by sector
  const bySector={};
  for(const r of RAW){
    const o={ticker:r[0],sector:r[1],price:r[2],cap:r[3],dod:r[4],wow:r[5]};
    (bySector[o.sector]=bySector[o.sector]||[]).push(o);
  }
  const sectors=SECTOR_ORDER.filter(s=>bySector[s]).map(s=>{
    const cap=bySector[s].reduce((a,b)=>a+b.cap,0);
    return {name:s,value:cap,items:bySector[s]};
  });

  // top-level squarify by sector cap
  const secRects=squarify(sectors,0,0,W,H);
  for(const sr of secRects){
    const [sx,sy,sw,sh]=sr.rect;
    const secDiv=document.createElement('div');
    secDiv.className='sector';
    secDiv.style.cssText=`left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px;`;
    const lbl=document.createElement('div');
    lbl.className='sector-label';lbl.textContent=sr.name;
    secDiv.appendChild(lbl);

    // items within sector, inset for label
    const items=sr.items.map(it=>({...it,value: sizeMode==='Equal'?1:it.cap}));
    const pad=1, top=18;
    const rects=squarify(items,pad,top+pad,Math.max(1,sw-2*pad),Math.max(1,sh-top-2*pad));
    for(const t of rects){
      const [tx,ty,tw,th]=t.rect;
      const val=colorMode==='WoW %'?t.wow:t.dod;
      const d=document.createElement('div');
      d.className='tile';
      d.style.cssText=`left:${tx}px;top:${ty}px;width:${tw}px;height:${th}px;background:${colorFor(val)};`;
      const area=tw*th;
      let html=`<div class="tk">${t.ticker}</div>`;
      if(area>2600) html+=`<div class="dp">${t.dod>=0?'+':''}${t.dod.toFixed(2)}%</div>`;
      if(area>7000) html+=`<div class="pr">$${t.price}</div><div class="ww">W ${t.wow>=0?'+':''}${t.wow.toFixed(1)}%</div>`;
      d.innerHTML=html;
      // font sizing
      const fs=Math.max(8,Math.min(20,Math.sqrt(area)/7));
      d.style.fontSize=fs+'px';
      d.addEventListener('mousemove',e=>showTip(e,t));
      d.addEventListener('mouseleave',hideTip);
      secDiv.appendChild(d);
    }
    map.appendChild(secDiv);
  }
}

const tt=document.getElementById('tt');
function showTip(e,t){
  tt.style.display='block';
  tt.innerHTML=`<b>${t.ticker}</b> &nbsp;<span style="color:#8b949e">${t.sector}</span>
    <div class="row"><span>Price</span><span>$${t.price}</span></div>
    <div class="row"><span>DoD</span><span>${t.dod>=0?'+':''}${t.dod.toFixed(2)}%</span></div>
    <div class="row"><span>WoW</span><span>${t.wow>=0?'+':''}${t.wow.toFixed(2)}%</span></div>
    <div class="row"><span>Mkt cap</span><span>$${t.cap}B</span></div>
    ${sparkline(t.ticker,t.sector)}`;
  const w=210,h=180,pad=14;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>window.innerWidth)x=e.clientX-w-pad;
  if(y+h>window.innerHeight)y=e.clientY-h-pad;
  tt.style.left=Math.max(4,x)+'px';tt.style.top=Math.max(4,y)+'px';
}
function hideTip(){tt.style.display='none';}

document.getElementById('sizeSel').addEventListener('change',build);
document.getElementById('colorSel').addEventListener('change',build);
window.addEventListener('resize',build);
build();
</script>
</body>
